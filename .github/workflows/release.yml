# Pushing a tag such as v0.2.0 builds the Windows distribution on GitHub's machine (tests included), packs it as a zip with
# its SHA-256, records where it was built (build provenance, for public repositories) and publishes a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance
      attestations: write # store the build provenance
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The tag without its leading v must equal the Version in Directory.Build.props (build.ps1 stops otherwise).
      - name: Build, test and publish
        shell: pwsh
        run: ./scripts/build.ps1 -Version ($env:TAG -replace '^v','')
      - name: Package
        shell: pwsh
        run: |
          $name = "IORecorder-$env:TAG-win-x64.zip"
          Compress-Archive -Path dist/IORecorder-win-x64/* -DestinationPath $name
          # One line ending in LF, as sha256sum -c expects (Out-File would end it with CR LF).
          [IO.File]::WriteAllText("$PWD/$name.sha256", "$((Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant())  $name`n")
          "ASSET=$name" >> $env:GITHUB_ENV
      # Lets anyone check that the zip and the programs in it were built here from this repository's code:
      #   gh attestation verify <file> -R <owner>/<repo>
      - name: Build provenance
        id: provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            IORecorder-*-win-x64.zip
            dist/IORecorder-win-x64/IORecorder.exe
            dist/IORecorder-win-x64/iorecorder-cli.exe
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        # A version with a suffix (v0.2.0-beta.1) is published as a pre-release.
        run: |
          $prerelease = if ($env:TAG -match '-') { @('--prerelease') } else { @() }
          $assets = @($env:ASSET, "$env:ASSET.sha256")
          # The provenance as a Sigstore bundle beside the zip, to check it without GitHub's API:
          #   gh attestation verify <zip> --bundle <bundle> -R <owner>/<repo>
          if ($env:BUNDLE) { $bundle = "IORecorder-$env:TAG-provenance.sigstore.json"; Copy-Item $env:BUNDLE $bundle; $assets += $bundle }
          gh release create "$env:TAG" @assets --title "IO Recorder $env:TAG" --generate-notes --verify-tag @prerelease
